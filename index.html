<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Cocos Creator | downwell-demo</title>

  <!--http://www.html5rocks.com/en/mobile/mobifying/-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!--https://developer.apple.com/library/safari/documentation/AppleApplications/Reference/SafariHTMLRef/Articles/MetaTags.html-->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">

  <!-- force webkit on 360 -->
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <!-- force edge on IE -->
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">

  <!-- force full screen on some browser -->
  <meta name="full-screen" content="yes"/>
  <meta name="x5-fullscreen" content="true"/>
  <meta name="360-fullscreen" content="true"/>

  <!--fix fireball/issues/3568 -->
  <!--<meta name="browsermode" content="application">-->
  <meta name="x5-page-mode" content="app">

  <!--<link rel="apple-touch-icon" href=".png" />-->
  <!--<link rel="apple-touch-icon-precomposed" href=".png" />-->

  <!-- official 3.8.5 web-mobile template: cssUrl -> style.css -->
  <link rel="stylesheet" type="text/css" href="style.css"/>

  <!-- 画布尺寸由 ViewBootstrap.ts 按窗口整数倍缩放运行时设置 -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overscroll-behavior: none;
    }

    #GameDiv,
    #Cocos3dGameContainer {
      touch-action: none;
      -webkit-user-select: none;
    }

    #GameCanvas {
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body>
  <!-- cc_exact_fit_screen=false：不要铺满窗口，保持 320×568 居中 -->
  <div id="GameDiv" cc_exact_fit_screen="false">
      <div id="Cocos3dGameContainer">
        <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
      </div>
    </div>

  <!--
    以下脚本块对应 Cocos Creator 3.8.5 官方
    resources/3d/engine/templates/web-mobile/index-plugin.ejs 渲染结果。
    cc.js 不直接 <script src="cocos-js/cc.js">（那是 SystemJS 模块），
    而是由 src/import-map.json 映射 "cc" -> cocos-js/cc.js，再由 index.js System.import('cc')。
  -->
  <!-- Polyfills bundle. -->
  <script src="src/polyfills.bundle.js?v=20261105205411" charset="utf-8"> </script>

  <!-- SystemJS support. -->
  <script src="src/system.bundle.js?v=20261105205411" charset="utf-8"> </script>

  <!-- Import map -->
  <script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

  <script>
    System.import('./index.js').catch(function(err) { console.error(err); })
  </script>

  <script>
    (function () {
      var tries = 0;
      var maxTries = 200;

      function applyDesignResolution() {
        try {
          var engine = window.cc || window.CC;
          if (!engine) {
            return false;
          }
          var view = engine.view;
          if (!view || typeof view.setDesignResolutionSize !== 'function') {
            return false;
          }

          // 真正的强制在 ViewBootstrap.ts。
          // 这里只设设计分辨率和 canvas 元素属性，去掉 setCanvasSize / resizeWithBrowserSize，避免和运行时抢。
          var canvas = document.getElementById('GameCanvas');
          if (canvas) {
            canvas.width = 320;
            canvas.height = 568;
          }

          var policy = 4;
          if (engine.ResolutionPolicy && engine.ResolutionPolicy.SHOW_ALL != null) {
            policy = engine.ResolutionPolicy.SHOW_ALL;
          }
          view.setDesignResolutionSize(160, 284, policy);

          if (canvas) {
            canvas.width = 320;
            canvas.height = 568;
          }
          return true;
        } catch (err) {
          return true;
        }
      }

      function tick() {
        if (applyDesignResolution()) {
          return;
        }
        tries += 1;
        if (tries >= maxTries) {
          return;
        }
        setTimeout(tick, 50);
      }

      tick();
    })();
  </script>
</body>
</html>
